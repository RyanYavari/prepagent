[pytest]
# Add backend directory to Python path for imports
pythonpath = .

# Suppress warnings
filterwarnings =
    ignore::DeprecationWarning

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
